/* ---- GitHub sync ---- */

const rad=Math.PI/180,MN=6e4,fx=(a,b)=>a-b*Math.floor(a/b),PN=Object.fromEntries(PR),GN={fajr:'ফজরের',dhuhr:'যোহরের',asr:'আসরের',maghrib:'মাগরিবের',isha:'ইশার'};

function sp(j){const D=j-2451545,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*Math.sin(g*rad)+.02*Math.sin(2*g*rad),360),e=23.439-3.6e-7*D,RA=fx(Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))/rad/15,24);return{d:Math.asin(Math.sin(e*rad)*Math.sin(L*rad))/rad,e:q/15-RA}}
function ptm(off){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);const k=ymd(d);if(TC[k])return TC[k];
  const la=CFG.la||23.85,ln=CFG.ln||90.26,tz=-d.getTimezoneOffset()/60;let y=d.getFullYear(),m=d.getMonth()+1;if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d.getDate()+2-A+Math.floor(A/4)-1524.5-ln/360;

  const r={fj:ang(18,5,-1),sr:ang(.833,6,-1),dh:mid(12)+.0333,as:asr(13),ss:ang(.833,18,1),is:ang(18,18,1)},o={};

  const a=acc(),m=SESS.m,nm=S.accounts.filter(x=>x.g!=='f').length;let h='';
  if(m)h+=`<div class="card"><h2>মাস্টার প্যানেল</h2><p>সব অ্যাকাউন্ট এখান থেকে দেখা ও পরিচালনা করা যায়।</p><div class="tiles"><div class="tl"><b>${bn(S.accounts.length)}</b><span>মোট অ্যাকাউন্ট</span></div><div class="tl"><b>${bn(nm)}</b><span>পুরুষ</span></div><div class="tl"><b>${bn(S.accounts.length-nm)}</b><span>মহিলা</span></div></div>
  ${S.accounts.map(x=>`<div class="row"><button class="av" style="background:${x.c}" data-a="pick" data-id="${x.id}">${esc(x.name[0])}</button><div class="nm">${esc(x.name)}<small>${gb(x)}${x.id===S.active?' · দেখছেন':''}</small></div>${x.id===S.active?'':`<button class="btn sm ghost" data-a="pick" data-id="${x.id}">দেখুন</button>`}<button class="btn sm red" data-a="del" data-id="${x.id}">মুছুন</button></div>`).join('')}
  <div style="margin-top:14px"><label for="nn">নতুন অ্যাকাউন্টের নাম</label><input id="nn" maxlength="30" placeholder="নাম লিখুন"><div class="chips" style="margin-bottom:12px"><button class="chip${ng==='m'?' on':''}" data-a="ng" data-g="m">পুরুষ</button><button class="chip${ng==='f'?' on':''}" data-a="ng" data-g="f">মহিলা</button></div><button class="btn" data-a="add">অ্যাকাউন্ট খুলুন</button> <button class="btn ghost" data-a="mpin">মাস্টার পিন বদলান</button></div></div>`;
  else if(a)h+=`<div class="card"><h2>আমার অ্যাকাউন্ট</h2><div class="row"><span class="av" style="background:${a.c}">${esc(a.name[0])}</span><div class="nm">${esc(a.name)}<small>${gb(a)}</small></div></div></div>`;
  h+=vLoc();if(m)h+=vSync(false)+vBackup();
  return h+`<div class="card"><button class="btn red" data-a="out">লগআউট</button></div>`}
const H=async(p,z)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(z+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const sess=o=>{SESS=o;localStorage.setItem('dd_sess',JSON.stringify(o));gs={t:'main'};tab='dash';render()};
async function doLogin(){const p=$('#lp').value;let ok;
  if(gs.id==='m')ok=await H(p,'master')===S.master.pin;else{const x=S.accounts.find(z=>z.id===gs.id);ok=!!x&&await H(p,x.id)===x.pin}
  ok?sess(gs.id==='m'?{m:1}:{id:gs.id}):toast('পিন ভুল')}
async function mkMaster(){const p=$('#mp1').value;if(p.length<4){toast('কমপক্ষে ৪ অক্ষরের পিন দিন');return}if(p!==$('#mp2').value){toast('দুটো পিন মেলেনি');return}
  S.master={pin:await H(p,'master'),u:Date.now()};save();sess({m:1})}
const authed=()=>S.master&&(SESS.m||acc());
function gate(){
  let b;
  if(gs.t==='restore')b=`<div style="text-align:left">${vSync(true)}${vBackup()}</div><button class="btn ghost" data-a="gate" data-t="main">ফিরে যান</button>`;
  else if(!S.master)b=`<div class="card"><h2>মাস্টার অ্যাকাউন্ট তৈরি করুন</h2><p>মাস্টার সব অ্যাকাউন্ট দেখতে ও পরিচালনা করতে পারবে। একটি পিন দিন (কমপক্ষে ৪ অক্ষর)।</p><input id="mp1" type="password" inputmode="numeric" placeholder="পিন"><input id="mp2" type="password" inputmode="numeric" placeholder="আবার পিন"><button class="btn" data-a="mk">তৈরি করুন</button></div><button class="btn ghost" data-a="gate" data-t="restore">আগের ডেটা ফিরিয়ে আনুন</button>`;
  else if(gs.t==='pin'){const x=S.accounts.find(z=>z.id===gs.id);b=`<div class="card"><h2>${gs.id==='m'?'মাস্টার লগইন':esc(x?x.name:'')}</h2><input id="lp" type="password" inputmode="numeric" placeholder="পিন"><div class="btns"><button class="btn" data-a="lgin">প্রবেশ</button><button class="btn ghost" data-a="gate" data-t="main">ফিরে যান</button></div></div>`}
  else b=`<div class="card"><h2>কে প্রবেশ করবেন?</h2>${S.accounts.map(x=>`<button class="row ac" data-a="acct" data-id="${x.id}"><span class="av" style="background:${x.c}">${esc(x.name[0])}</span><span class="nm">${esc(x.name)}${x.pin?'<small>পিন দিয়ে সুরক্ষিত</small>':''}</span>›</button>`).join('')||'<p>কোনো অ্যাকাউন্ট নেই। মাস্টার দিয়ে প্রবেশ করে অ্যাকাউন্ট খুলুন।</p>'}</div><button class="btn ghost" data-a="gate" data-t="pin" data-id="m">মাস্টার লগইন</button>`;
  $('#app').innerHTML=`<div class="gt"><img src="icon-192.png" alt=""><h1>দৈনিক আমল</h1>${b}</div>`}
function render(){
  if(!authed())return gate();
  const a=acc(),sl={ok:'সিঙ্ক হয়েছে '+sy.msg,busy:'সিঙ্ক হচ্ছে…',err:sy.msg||'সিঙ্ক ব্যর্থ',idle:'সংযুক্ত'};
  const T=[['dash','ড্যাশবোর্ড'],['today','আজ'],['stats','পরিসংখ্যান'],['set','সেটিংস']];
  $('#app').innerHTML=`<header><div class="brand"><img src="icon-192.png" alt="">দৈনিক আমল${SESS.m?' <span class="mb">মাস্টার</span>':''}</div><div class="hr">${CFG.t?`<span class="sync ${sy.st}"><i></i>${sl[sy.st]}</span>`:''}${a?`<button class="av" style="background:${a.c}" data-a="tab" data-v="set" aria-label="অ্যাকাউন্ট">${esc(a.name[0])}</button>`:''}<button class="ib" data-a="out" aria-label="লগআউট"><svg viewBox="0 0 24 24">${IC.out}</svg></button></div></header>
  ${tab==='dash'?vDash(a):tab==='today'?vToday(a):tab==='stats'?vStats(a):vSet()}
  <nav><div>${T.map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="tab" data-v="${k}"><svg viewBox="0 0 24 24">${IC[k]}</svg>${l}</button>`).join('')}</div></nav>`;
}

/* ---- actions ---- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t)return;
  const a=acc(),d=t.dataset,v=id=>document.getElementById(id).value.trim();
  switch(d.a){
    case 'tab':tab=d.v;window.scrollTo(0,0);break;
    case 'nav':{const n=new Date(day);n.setDate(n.getDate()+Number(d.d));if(n<=new Date()){day=n;edit=false}break}
    case 'p':{const k=ymd(day);if(k!==ymd(new Date())&&!edit){toast('পুরনো দিনের তথ্য লক করা আছে');return}
      const id=d.p,s=+d.s,x=ent(a,k),op=x.p[id]||0;
      if(op&&!confirm('"'+PN[id]+'" এর অবস্থা বদলাতে চান?'))return;
      x.p[id]=op===s?0:s;x.t=Date.now();save();render();
      toast(PN[id]+': '+(x.p[id]?SL(a,x.p[id]):'মুছে ফেলা হয়েছে'),()=>{x.p[id]=op;x.t=Date.now();save();render()});return}
    case 'x':{const k=ymd(day);if(k!==ymd(new Date())&&!edit){toast('পুরনো দিনের তথ্য লক করা আছে');return}
      const x=ent(a,k),op=x.x[d.x]||0;x.x[d.x]=op?0:1;x.t=Date.now();save();render();
      toast(EX.find(z=>z[0]===d.x)[1]+(op?' বাদ দেওয়া হলো':' যোগ হলো'),()=>{x.x[d.x]=op;x.t=Date.now();save();render()});return}
    case 'pick':S.active=d.id;save();toast('অ্যাকাউন্ট বদলানো হয়েছে');break;
    case 'add':{const n=v('nn');if(!n){toast('নাম লিখুন');return}
      const id=Date.now().toString(36)+Math.random().toString(36).slice(2,6);
      S.accounts.push({id,name:n,g:ng,c:COL[S.accounts.length%COL.length],cr:Date.now(),u:Date.now(),days:{}});S.active=id;save();toast('অ্যাকাউন্ট খোলা হয়েছে');break}
    case 'per':per=+d.n;break;
    case 'mo':mo=Math.min(0,mo+ +d.d);break;
    case 'edit':edit=!edit;break;
    case 'ng':ng=d.g;break;
    case 'gen':{const x=S.accounts.find(z=>z.id===d.id);x.g=x.g==='f'?'m':'f';x.u=Date.now();save();break}
    case 'loc':navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{CFG.la=+p.coords.latitude.toFixed(4);CFG.ln=+p.coords.longitude.toFixed(4);localStorage.setItem('dd_cfg',JSON.stringify(CFG));TC={};render();toast('অবস্থান আপডেট হয়েছে')},()=>toast('অবস্থান পাওয়া যায়নি'),{timeout:10000}):toast('এই ব্রাউজারে সম্ভব নয়');return;
    case 'del':{const x=S.accounts.find(z=>z.id===d.id);
      if(!confirm('"'+x.name+'" অ্যাকাউন্ট ও এর সব তথ্য মুছে যাবে। নিশ্চিত?'))return;
      S.del=[...(S.del||[]),x.id];S.accounts=S.accounts.filter(z=>z.id!==x.id);if(!acc())S.active=S.accounts[0]?S.accounts[0].id:null;save();break}
    case 'cfg':CFG={...CFG,o:v('go'),r:v('gr'),p:v('gp')||'dd-data.json',t:v('gt')};
      if(!CFG.o||!CFG.r||!CFG.t){toast('সব ঘর পূরণ করুন');CFG={};return}
      localStorage.setItem('dd_cfg',JSON.stringify(CFG));doSync();break;
    case 'sync':doSync();return;
    case 'unlink':CFG={la:CFG.la,ln:CFG.ln};localStorage.setItem('dd_cfg',JSON.stringify(CFG));sy={st:'idle',msg:''};toast('GitHub সংযোগ বিচ্ছিন্ন');break;
    case 'out':SESS={};localStorage.setItem('dd_sess','{}');gs={t:'main'};tab='dash';edit=false;break;
    case 'gate':gs={t:d.t,id:d.id};break;
    case 'acct':{const x=S.accounts.find(z=>z.id===d.id);if(x.pin)gs={t:'pin',id:x.id};else{sess({id:x.id});return}break}
    case 'lgin':doLogin();return;
    case 'mk':mkMaster();return;
    case 'ssync':showSync=!showSync;break;
    case 'ended':showEnded=!showEnded;break;
    case 'pin':{const x=S.accounts.find(z=>z.id===d.id),p=prompt('নতুন পিন (কমপক্ষে ৪ অক্ষর)। ফাঁকা রাখলে পিন সরে যাবে।');if(p===null)return;
      if(p&&p.length<4){toast('কমপক্ষে ৪ অক্ষর দিন');return}
      H(p,x.id).then(h=>{x.pin=p?h:'';x.u=Date.now();save();render();toast(p?'পিন সেট হয়েছে':'পিন সরানো হয়েছে')});return}
    case 'mpin':{const p=prompt('নতুন মাস্টার পিন (কমপক্ষে ৪ অক্ষর)');if(!p)return;if(p.length<4){toast('কমপক্ষে ৪ অক্ষর দিন');return}
      H(p,'master').then(h=>{S.master={pin:h,u:Date.now()};save();toast('মাস্টার পিন বদলানো হয়েছে')});return}
    case 'dl':{const b=new Blob([JSON.stringify(S,null,1)],{type:'application/json'}),l=document.createElement('a');
      l.href=URL.createObjectURL(b);l.download='daily-deeds-'+ymd(new Date())+'.json';l.click();setTimeout(()=>URL.revokeObjectURL(l.href),1000);toast('ব্যাকআপ ডাউনলোড হচ্ছে');return}
    case 'up':$('#file').click();return;
  }
  render();
});
$('#file').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.accounts)throw 0;merge(j);save();render();toast('ব্যাকআপ ফিরিয়ে আনা হয়েছে')}catch(x){toast('ফাইলটি সঠিক ব্যাকআপ নয়')}};
  r.readAsText(f);e.target.value='';
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&CFG.t)doSync()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();if(CFG.t)doSync();
setInterval(()=>{if(tab!=='set'&&authed()&&!document.hidden)render()},60000);
</script>
</body>
</html>
