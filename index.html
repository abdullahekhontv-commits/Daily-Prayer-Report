<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1F24">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<meta name="mobile-web-app-capable" content="yes">
<title>দৈনিক আমল</title>
<style>
:root{--bg:#EDF2F0;--sf:#fff;--ink:#10302B;--mut:#5E7873;--ln:#D8E3E0;--ac:#0F6B57;--ac2:#E3F1EC;--gold:#B98A2C;--s1:#0F6B57;--s2:#2B7FA6;--s3:#C98414;--s4:#C4475A;--sh:0 1px 2px rgba(16,48,43,.06),0 10px 24px -14px rgba(16,48,43,.25)}
@media(prefers-color-scheme:dark){:root{--bg:#081619;--sf:#10262A;--ink:#E6F1EE;--mut:#8FA9A4;--ln:#1E3A3F;--ac:#3FC4A0;--ac2:#14342F;--gold:#E2B65A;--s1:#1E9C7F;--s2:#3A8DB8;--s3:#C98414;--s4:#C4475A;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans Bengali","Hind Siliguri",system-ui,sans-serif;line-height:1.5}
#app{max-width:520px;margin:0 auto;padding:env(safe-area-inset-top) 16px calc(88px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 10px}
.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:700}
.brand img{width:34px;height:34px;border-radius:10px}
.hr{display:flex;align-items:center;gap:10px}
.sync{font-size:12px;color:var(--mut);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.sync.ok i{background:var(--s1)}.sync.busy i{background:var(--gold)}.sync.err i{background:var(--s4)}
.av{width:36px;height:36px;border-radius:50%;border:0;color:#fff;font-weight:700;font-size:16px;font-family:inherit}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.card h2{margin:0 0 4px;font-size:17px}
.card p{margin:0 0 12px;color:var(--mut);font-size:14px}
.dn{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px}
.dn b{font-size:16px}.dn small{display:block;color:var(--mut);font-weight:400;text-align:center}
.dn button{width:40px;height:40px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);font-size:20px}
.dn button:disabled{opacity:.35}
.hero{display:flex;align-items:center;gap:18px;background:linear-gradient(150deg,#0E3B36,#081F24);color:#E6F1EE;border:0}
.hero svg{flex:none}.hero .n{font-size:30px;font-weight:700;line-height:1.1}
.hero .m{color:#9DC0B8;font-size:14px}.hero .g{color:#E2B65A;font-weight:700}
.pr{padding:14px}
.pr .t{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700;font-size:17px}
.pr .t span{font-size:13px;font-weight:400;color:var(--mut)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg button{border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:12px;padding:9px 0;font-weight:600;font-size:14px;font-family:inherit}
.seg button.on{color:#fff;border-color:transparent}
.s1.on{background:var(--s1)}.s2.on{background:var(--s2)}.s3.on{background:var(--s3)}.s4.on{background:var(--s4)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--ln);background:transparent;color:var(--ink);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14px;font-family:inherit}
.chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:12px;text-align:center}
.stat b{display:block;font-size:24px;color:var(--ac)}.stat span{font-size:12px;color:var(--mut)}
.bars{display:flex;align-items:flex-end;justify-content:space-between;height:130px;gap:8px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:12px;color:var(--mut)}
.bars i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--ac);min-height:4px;margin-bottom:6px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.heat i{aspect-ratio:1;border-radius:8px;background:var(--ln)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--ln)}
.row:first-of-type{border-top:0}.row .av{width:40px;height:40px;flex:none}.row .nm{flex:1;font-weight:600}
.row .nm small{display:block;color:var(--mut);font-weight:400}
.btn{border:0;background:var(--ac);color:#fff;border-radius:14px;padding:12px 18px;font-weight:700;font-size:15px;font-family:inherit}
.btn.ghost{background:transparent;color:var(--ac);border:1px solid var(--ln)}
.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.red{background:transparent;color:var(--s4);border:1px solid var(--ln)}
.btns{display:flex;gap:10px;flex-wrap:wrap}
input{width:100%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font-size:15px;font-family:inherit;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
.hint{font-size:13px;color:var(--mut);margin:0 0 12px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
nav div{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav button{border:0;background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-weight:600;font-size:12px;font-family:inherit}
nav button.on{color:var(--ac)}nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.sky{padding:0;overflow:hidden;border:0;background:#0B2A33;color:#E6F1EE}.sky svg{display:block;width:100%}
.cw{padding:6px 18px 18px;display:flex;flex-direction:column;gap:2px}.cw b{font-size:18px}.cw span{color:#9DC0B8;font-size:14px}
.cw em{font-style:normal;margin-top:8px;background:#C4475A;color:#fff;border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.tt div{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid var(--ln)}.tt div:first-child{border-top:0}
.tt span{color:var(--mut)}.tt .cur,.tt .cur span{color:var(--ac);font-weight:700}.tt.fb b,.tt.fb span{color:var(--s4)}.card h2.rd{margin-top:16px;color:var(--s4)}
.pd{margin-bottom:14px}.tiles{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;margin-bottom:14px}
.tl{text-align:center}.tl b{display:block;font-size:24px}.tl span{font-size:12px;color:var(--mut)}
.sb{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--ln);gap:2px}.sb i{display:block}
.sb .s1,.dot.s1,.dc.s1{background:var(--s1)}.sb .s2,.dot.s2,.dc.s2{background:var(--s2)}.sb .s3,.dot.s3,.dc.s3{background:var(--s3)}.sb .s4,.dot.s4,.dc.s4{background:var(--s4)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%}
.pp{padding:10px 0;border-top:1px solid var(--ln)}.pp>div{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px}.pp small{color:var(--mut);font-size:12px;text-align:right}
.lg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--mut);margin-bottom:10px}
.dr{display:grid;grid-template-columns:48px repeat(5,1fr);gap:6px;align-items:center;padding:6px 0;border-top:1px solid var(--ln)}.dr.hd{border-top:0;text-align:center;color:var(--mut)}
.dd b{display:block;line-height:1.1}.dd small{color:var(--mut);font-size:12px}
.dc{justify-self:center;width:30px;height:30px;border-radius:10px;background:var(--ln);display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.lockb{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px}
.seg button.au{opacity:.6}button:disabled{opacity:.45}.lk{border:0;background:none;color:var(--ac);padding:0;font-family:inherit;font-size:13px;font-weight:600}
#toast.act{pointer-events:auto}#toast button{margin-left:8px;border:0;background:none;color:var(--gold);font-family:inherit;font-weight:700;font-size:inherit}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<input type="file" id="file" accept="application/json,.json" hidden>
<script>
const PR=[['fajr','ফজর'],['dhuhr','যোহর'],['asr','আসর'],['maghrib','মাগরিব'],['isha','ইশা']];
const ST=[[1,'জামাতে'],[2,'একা'],[3,'কাযা'],[4,'মিস']];
const EX=[['witr','বিতর'],['duha','চাশত'],['quran','কুরআন তিলাওয়াত'],['dhikr','যিকির'],['dua','দুআ'],['sadaqa','সদকা']];
const COL=['#0F6B57','#2B7FA6','#B5651D','#7A4FA3','#C4475A','#4C6B2F'];
const IC={dash:'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6 7 7M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/>',today:'<circle cx="12" cy="12" r="9"/><path d="m8 12.5 3 3 5-6"/>',stats:'<path d="M5 20V10M12 20V4M19 20v-7"/>',set:'<path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/>'};
const $=s=>document.querySelector(s);
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let S=ld('dd_state',{v:1,accounts:[],active:null,del:[]}),CFG=ld('dd_cfg',{}),tab='dash',per=7,mo=0,edit=false,ng='m',TC={},day=new Date(),sy={st:'idle',msg:''},tm;
const bn=n=>Number(n).toLocaleString('bn-BD');
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const acc=()=>S.accounts.find(a=>a.id===S.active);
const full=e=>e&&PR.every(([i])=>[1,2,3].includes(e.p[i]));
const pts=e=>e?PR.reduce((s,[i])=>s+(e.p[i]<3&&e.p[i]>0?1:e.p[i]===3?.5:0),0)/5:0;
function toast(m,u){const t=$('#toast');t.textContent=m+' ';t.classList.toggle('act',!!u);
  if(u){const b=document.createElement('button');b.textContent='বাতিল';b.onclick=()=>{u();t.classList.remove('show')};t.appendChild(b)}
  t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),u?5000:2600)}
function save(skip){localStorage.setItem('dd_state',JSON.stringify(S));if(!skip&&CFG.t){clearTimeout(tm);setSt('busy');tm=setTimeout(doSync,2500)}}
function setSt(st,msg){sy={st,msg:msg||''};render()}
function ent(a,k){return a.days[k]||(a.days[k]={p:{},x:{}})}
function streak(a){let n=0,d=new Date();if(!full(a.days[ymd(d)]))d.setDate(d.getDate()-1);while(full(a.days[ymd(d)])){n++;d.setDate(d.getDate()-1)}return n}

/* ---- GitHub sync ---- */
const api=()=>`https://api.github.com/repos/${CFG.o}/${CFG.r}/contents/${CFG.p||'dd-data.json'}`;
const hd=()=>({Authorization:'Bearer '+CFG.t,Accept:'application/vnd.github+json'});
const enc=s=>btoa(unescape(encodeURIComponent(s)));
const dec=s=>decodeURIComponent(escape(atob(s.replace(/\n/g,''))));
function merge(r){
  if(!r||!r.accounts)return;
  S.del=[...new Set([...(S.del||[]),...(r.del||[])])];
  for(const ra of r.accounts){
    if(S.del.includes(ra.id))continue;
    const a=S.accounts.find(x=>x.id===ra.id);
    if(!a){S.accounts.push(ra);continue}
    if((ra.u||0)>(a.u||0)){a.name=ra.name;a.g=ra.g;a.u=ra.u}
    for(const k in ra.days){const l=a.days[k];if(!l||(ra.days[k].t||0)>(l.t||0))a.days[k]=ra.days[k]}
  }
  S.accounts=S.accounts.filter(a=>!S.del.includes(a.id));
  if(!acc())S.active=S.accounts[0]?S.accounts[0].id:null;
}
async function doSync(){
  if(!CFG.t||!CFG.o||!CFG.r)return;
  setSt('busy');
  try{
    for(let i=0;i<2;i++){
      const g=await fetch(api(),{headers:hd(),cache:'no-store'});
      let sha;
      if(g.status===200){const j=await g.json();sha=j.sha;merge(JSON.parse(dec(j.content)))}
      else if(g.status!==404)throw new Error(g.status===401?'টোকেন ভুল বা মেয়াদ শেষ':g.status===404?'':'GitHub ত্রুটি '+g.status);
      const p=await fetch(api(),{method:'PUT',headers:{...hd(),'Content-Type':'application/json'},body:JSON.stringify({message:'sync '+new Date().toISOString(),content:enc(JSON.stringify(S)),sha})});
      if(p.ok){save(true);sy={st:'ok',msg:new Date().toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'})};render();return}
      if(p.status!==409&&p.status!==422)throw new Error(p.status===403||p.status===404?'রিপো বা অনুমতি সঠিক নয়':'GitHub ত্রুটি '+p.status);
    }
    throw new Error('দ্বন্দ্ব হয়েছে, আবার চেষ্টা করুন');
  }catch(e){setSt('err',e.message==='Failed to fetch'?'ইন্টারনেট নেই':e.message)}
}

/* ---- views ---- */
/* ---- prayer times ---- */
const rad=Math.PI/180,MN=6e4,fx=(a,b)=>a-b*Math.floor(a/b),PN=Object.fromEntries(PR),GN={fajr:'ফজরের',dhuhr:'যোহরের',asr:'আসরের',maghrib:'মাগরিবের',isha:'ইশার'};
const fm=d=>d.toLocaleTimeString('bn-BD',{hour:'numeric',minute:'2-digit'});
const SL=(a,s)=>s===2&&a.g==='f'?'সময়মতো':['','জামাতে','একা','কাযা','মিস'][s];
function sp(j){const D=j-2451545,g=fx(357.529+.98560028*D,360),q=fx(280.459+.98564736*D,360),L=fx(q+1.915*Math.sin(g*rad)+.02*Math.sin(2*g*rad),360),e=23.439-3.6e-7*D,RA=fx(Math.atan2(Math.cos(e*rad)*Math.sin(L*rad),Math.cos(L*rad))/rad/15,24);return{d:Math.asin(Math.sin(e*rad)*Math.sin(L*rad))/rad,e:q/15-RA}}
function ptm(off){
  const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()+off);const k=ymd(d);if(TC[k])return TC[k];
  const la=CFG.la||23.85,ln=CFG.ln||90.26,tz=-d.getTimezoneOffset()/60;let y=d.getFullYear(),m=d.getMonth()+1;if(m<=2){y--;m+=12}
  const A=Math.floor(y/100),jd=Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d.getDate()+2-A+Math.floor(A/4)-1524.5-ln/360;
  const mid=t=>fx(12-sp(jd+t/24).e,24);
  const ang=(a,t,z)=>{const de=sp(jd+t/24).d*rad,c=(-Math.sin(a*rad)-Math.sin(de)*Math.sin(la*rad))/(Math.cos(de)*Math.cos(la*rad));return mid(t)+z*Math.acos(Math.max(-1,Math.min(1,c)))/rad/15};
  const asr=t=>{const de=sp(jd+t/24).d;return ang(-Math.atan(1/(2+Math.tan(Math.abs(la-de)*rad)))/rad,t,1)};
  const r={fj:ang(18,5,-1),sr:ang(.833,6,-1),dh:mid(12)+.0333,as:asr(13),ss:ang(.833,18,1),is:ang(18,18,1)},o={};
  for(const q in r)o[q]=new Date(d.getTime()+Math.round((r[q]+tz-ln/15)*36e5));
  return TC[k]=o}
function segs(){const o=[];for(const d of[-1,0]){const T=ptm(d),N=ptm(d+1);o.push(['fajr',T.fj,T.sr],['',T.sr,T.dh],['dhuhr',T.dh,T.as],['asr',T.as,T.ss],['maghrib',T.ss,T.is],['isha',T.is,N.fj])}return o}
function ended(k,id){const t=ymd(new Date()),n=new Date();
  if(k<t){return id!=='isha'||k!==ymd(new Date(Date.now()-864e5))||n>=ptm(0).fj}
  if(k>t)return false;const T=ptm(0),N=ptm(1);return n>=({fajr:T.sr,dhuhr:T.as,asr:T.ss,maghrib:T.is,isha:N.fj})[id]}
const eff=(a,k,id)=>{const s=(a.days[k]||{p:{}}).p[id];return s||(ended(k,id)?4:0)};
function tally(a,n){
  const ks=Object.keys(a.days).sort();let from=a.cr?ymd(new Date(a.cr)):ymd(new Date());if(ks[0]&&ks[0]<from)from=ks[0];
  const e=new Date();e.setHours(12,0,0,0);if(n){const x=new Date(e);x.setDate(x.getDate()-n+1);if(ymd(x)>from)from=ymd(x)}
  const R={};PR.forEach(([i])=>R[i]=[0,0,0,0,0]);
  for(const x=new Date(from+'T12:00:00');ymd(x)<=ymd(e);x.setDate(x.getDate()+1)){const k=ymd(x);PR.forEach(([i])=>R[i][eff(a,k,i)]++)}
  return R}
const tt=c=>c[1]+c[2]+c[3]+c[4],pc=(c,s)=>tt(c)?Math.round(c[s]/tt(c)*100):0;
const bar=c=>`<div class="sb">${[1,2,3,4].map(s=>c[s]?`<i class="s${s}" style="flex:${c[s]}"></i>`:'').join('')}</div>`;
function moon(x,y,r){const p=fx((Date.now()/864e5+2440587.5-2451550.1)/29.530588,1),k=Math.cos(2*Math.PI*p),w=p<.5,rx=Math.abs(k)*r;
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#26404a"/><path d="M${x} ${y-r}A${r} ${r} 0 0 ${w?1:0} ${x} ${y+r}A${rx} ${r} 0 0 ${w?(k>0?0:1):(k>0?1:0)} ${x} ${y-r}Z" fill="#F3E9C6"/>`}
function arc(now,T,FB){
  const day=now>=T.sr&&now<T.ss;let A,B,S2,C2;
  if(day){A=T.sr;B=T.ss;S2=[[T.sr,T.dh,''],[T.dh,T.as,'যোহর'],[T.as,T.ss,'আসর']];C2=['#7F9C96','#3FC4A0','#5AB0DC']}
  else{const E=now<T.sr?ptm(-1):T,M=now<T.sr?T:ptm(1);A=E.ss;B=M.sr;S2=[[E.ss,E.is,'মাগরিব'],[E.is,M.fj,'ইশা'],[M.fj,M.sr,'ফজর']];C2=['#E2B65A','#8E9BF0','#3FC4A0']}
  const f=t=>Math.min(1,Math.max(0,(t-A)/(B-A))),P=(q,k=1)=>[(160-130*k*Math.cos(Math.PI*q)).toFixed(1),(172-120*k*Math.sin(Math.PI*q)).toFixed(1)];
  const pa=(t1,t2)=>{const a=P(f(t1)),b=P(f(t2));return `M${a[0]} ${a[1]}A130 120 0 0 1 ${b[0]} ${b[1]}`};

});

if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();
render();if(CFG.t)doSync();
setInterval(()=>{if(tab!=='set'&&!document.hidden)render()},60000);
</script>
